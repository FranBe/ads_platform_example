services:

  #--------------------------------------------------------
  #                 PostgreSQL Database
  #--------------------------------------------------------
  pgdatabase: # Main database
    image: postgres:18
    container_name: postgres_db
    restart: always

    environment:
      POSTGRES_USER: "ads_user"
      POSTGRES_PASSWORD: "ads_pass"
      POSTGRES_DB: "ads_db"

    volumes:
      - postgres_data:/var/lib/postgresql

    ports:
      - "5432:5432"

    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      timeout: 5s
      retries: 10

  #--------------------------------------------------------
  #                      PGAdmin
  #--------------------------------------------------------
  pgadmin: # Web Admin for database
    image: dpage/pgadmin4

    environment:
      PGADMIN_DEFAULT_EMAIL: "admin@admin.com"
      PGADMIN_DEFAULT_PASSWORD: "root"

    volumes:
      - "pgadmin_data:/var/lib/pgadmin"
    ports:
      - "8085:80"

    depends_on:
      pgdatabase:
        condition: service_healthy

  #--------------------------------------------------------
  #                      FastAPI
  #--------------------------------------------------------
  fastapi_web: # Simple Web made with FastAPI
    build:
      context: ..
      dockerfile: dockerfile/Dockerfile
    
    container_name: fastapi_web

    env_file:
      - ../.env

    ports:
      - '8000:8000'

    depends_on:
      pgdatabase:
        condition: service_healthy


  #--------------------------------------------------------
  #                      Volumes
  #--------------------------------------------------------

volumes:
  postgres_data:
  pgadmin_data: